<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="generator" content="knowledge-base skill — assets/chat-viewer.html">
<title>Knowledge base — router playground</title>
<style>
  :root{
    --bg:#f6f5f2;
    --bg-alt:#ffffff;
    --ink:#1e1c1a;
    --ink-dim:#5a564f;
    --ink-faint:#8a857c;
    --line:#ddd8cf;
    --line-soft:#eae6dc;
    --card:#ffffff;
    --shadow:0 1px 2px rgba(30,28,26,.06), 0 1px 8px rgba(30,28,26,.04);
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --accent:#3a7ca5;
    --accent-soft:#e6eef4;
    --ok:#2f9d5d;
    --warn:#d9a441;
    --warn-soft:#fdf5e3;
    --bad:#c1493f;
    --bad-soft:#fbeceb;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#17161a;
      --bg-alt:#1e1d22;
      --ink:#eae7e0;
      --ink-dim:#a29d92;
      --ink-faint:#736e66;
      --line:#34323a;
      --line-soft:#2a2830;
      --card:#201f25;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.25);
      --accent:#6ba8cb;
      --accent-soft:#22313c;
      --ok:#4ec27f;
      --warn:#e5c07b;
      --warn-soft:#2e2717;
      --bad:#e08b83;
      --bad-soft:#33201e;
    }
  }
  *{box-sizing:border-box;}
  /* Must outrank the display rules below: the UA's [hidden]{display:none} loses
     to any author rule setting display, so capability gating would silently
     stop hiding controls. */
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       line-height:1.5;font-size:14px;}
  button,input,select,textarea{font:inherit;color:inherit;}
  code,pre{font-family:var(--mono);font-size:12px;}
  a{color:var(--accent);}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100vh;}
  @media (max-width:900px){ .layout{grid-template-columns:1fr;height:auto;} }

  /* ---- chat side ---- */
  .chat{display:flex;flex-direction:column;min-width:0;height:100vh;}
  @media (max-width:900px){ .chat{height:auto;min-height:70vh;} }
  .chat-head{padding:14px 20px;border-bottom:1px solid var(--line);
             display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .chat-head h1{font-size:1.05rem;margin:0;letter-spacing:-.01em;}
  .chat-head .meta{color:var(--ink-faint);font-size:12px;font-family:var(--mono);}
  .thread{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;}
  .composer{border-top:1px solid var(--line);padding:12px 20px 16px;background:var(--bg-alt);}
  .composer form{display:flex;gap:10px;align-items:flex-end;}
  .composer textarea{flex:1;resize:vertical;min-height:44px;max-height:200px;
                     padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
                     background:var(--card);}
  .composer .hint{color:var(--ink-faint);font-size:11px;margin:6px 2px 0;}

  .msg{max-width:min(76ch,100%);}
  .msg.user{align-self:flex-end;}
  .msg .bubble{padding:10px 14px;border-radius:var(--radius);border:1px solid var(--line-soft);
               background:var(--card);box-shadow:var(--shadow);white-space:pre-wrap;
               overflow-wrap:anywhere;}
  .msg.user .bubble{background:var(--accent-soft);border-color:transparent;}
  .msg .who{font-size:11px;color:var(--ink-faint);margin:0 4px 4px;
            text-transform:uppercase;letter-spacing:.06em;}

  /* ---- trace ---- */
  .trace{margin-top:10px;border:1px solid var(--line-soft);border-radius:var(--radius);
         background:var(--bg-alt);overflow:hidden;}
  .ribbon{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;align-items:center;}
  .chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:20px;
        border:1px solid var(--line);background:var(--card);color:var(--ink-dim);
        white-space:nowrap;}
  .chip.ok{border-color:var(--ok);color:var(--ok);}
  .chip.warn{border-color:var(--warn);color:var(--warn);}
  .chip.bad{border-color:var(--bad);color:var(--bad);}
  .chip.cache{border-color:var(--accent);color:var(--accent);}
  .trace details{border-top:1px solid var(--line-soft);}
  .trace summary{cursor:pointer;padding:7px 10px;font-size:12px;color:var(--ink-dim);
                 font-family:var(--mono);user-select:none;}
  .trace summary:hover{background:var(--line-soft);}
  .trace .body{padding:4px 10px 12px;}
  table.cands{width:100%;border-collapse:collapse;font-size:12px;}
  table.cands th{text-align:left;font-weight:600;color:var(--ink-faint);font-size:11px;
                 text-transform:uppercase;letter-spacing:.05em;padding:4px 6px;
                 border-bottom:1px solid var(--line);}
  table.cands td{padding:4px 6px;border-bottom:1px solid var(--line-soft);
                 vertical-align:top;}
  table.cands tr.cut td{opacity:.55;}
  table.cands td.score{font-family:var(--mono);white-space:nowrap;}
  .ctx{max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line-soft);
       border-radius:6px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;
       font-family:var(--mono);font-size:11px;}
  .errcard{margin:6px 0;padding:8px 10px;border:1px solid var(--bad);border-radius:6px;
           background:var(--bad-soft);font-size:12px;}
  .errcard b{display:block;margin-bottom:2px;}
  .notice{margin:6px 0;padding:8px 10px;border:1px solid var(--warn);border-radius:6px;
          background:var(--warn-soft);font-size:12px;}

  /* ---- admin ---- */
  .admin{border-left:1px solid var(--line);background:var(--bg-alt);overflow-y:auto;
         height:100vh;padding:0 0 40px;}
  @media (max-width:900px){ .admin{height:auto;border-left:0;border-top:1px solid var(--line);} }
  .admin h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;
            color:var(--ink-faint);margin:0;padding:14px 16px 6px;}
  .grp{border-bottom:1px solid var(--line-soft);padding:0 16px 14px;}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .row label{flex:1;font-size:12px;color:var(--ink-dim);}
  .row input[type=number],.row input[type=text],.row input[type=password],.row select{
    width:132px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);}
  .row.wide input,.row.wide select{width:100%;}
  .row input[type=range]{width:132px;}
  .stage{border:1px solid var(--line-soft);border-radius:var(--radius);padding:2px 10px 8px;
         margin:10px 0;background:var(--card);}
  .stage h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
            color:var(--ink-faint);margin:9px 0 2px;}
  textarea.prompt{width:100%;min-height:110px;padding:8px;border:1px solid var(--line);
                  border-radius:6px;background:var(--card);font-family:var(--mono);
                  font-size:11px;resize:vertical;}
  button{padding:6px 11px;border:1px solid var(--line);border-radius:6px;
         background:var(--card);cursor:pointer;font-size:12px;}
  button:hover{border-color:var(--accent);color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{opacity:.9;color:#fff;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .small{font-size:11px;color:var(--ink-faint);margin:4px 0 0;}
  .banner{margin:10px 16px;padding:8px 10px;border-radius:6px;font-size:12px;
          border:1px solid var(--warn);background:var(--warn-soft);}
  .banner.bad{border-color:var(--bad);background:var(--bad-soft);}
  dialog{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
         color:var(--ink);max-width:min(680px,92vw);padding:18px;}
  dialog::backdrop{background:rgba(0,0,0,.45);}
  .empty{color:var(--ink-faint);text-align:center;margin:auto;max-width:46ch;}
  .empty code{background:var(--line-soft);padding:1px 4px;border-radius:3px;}
  .fallback{padding:24px;}
</style>
</head>
<body>

<noscript>
  <div class="fallback">
    <h1>Router playground</h1>
    <p>This page needs JavaScript: it runs the router in your browser.</p>
  </div>
</noscript>

<!-- Shown until the app takes over, so it is also the state of a wiki that has
     not been compiled yet. The app hides it and unhides #app. -->
<div class="fallback" id="boot">
  <h1 id="boot-title">Nothing compiled here yet</h1>
  <p id="boot-lead">
    This page reads <code>_meta/chat-data.js</code>, and that file is not beside
    it yet. Put your documents in <code>raw_assets/</code> and run
    <code>/kb-build</code> in this folder, then reload this page.
  </p>
</div>

<div class="layout" id="app" hidden>
  <section class="chat">
    <div class="chat-head">
      <h1 id="chat-title">Knowledge base</h1>
      <span class="meta" id="head-meta"></span>
    </div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <form id="ask-form">
        <textarea id="q" rows="1" placeholder="Ask the knowledge base…"
                  autocomplete="off"></textarea>
        <button class="primary" id="send" type="submit">Ask</button>
      </form>
      <p class="hint" id="composer-hint"></p>
    </div>
  </section>

  <aside class="admin">
    <div id="banners"></div>

    <h2>Preset</h2>
    <div class="grp">
      <div class="row wide"><select id="preset-select"></select></div>
      <div class="btnrow">
        <button id="preset-save">Save</button>
        <button id="preset-dup">Duplicate…</button>
        <button id="preset-del">Delete</button>
        <button id="preset-reset">Revert</button>
      </div>
      <p class="small" id="preset-digest"></p>
    </div>

    <h2>API key</h2>
    <div class="grp">
      <div class="row wide">
        <input type="password" id="api-key" placeholder="sk-ant-…" autocomplete="off">
      </div>
      <div class="row"><label for="key-remember">Remember in this browser</label>
        <input type="checkbox" id="key-remember"></div>
      <p class="small" id="key-state"></p>
    </div>

    <h2>Retrieval</h2>
    <div class="grp">
      <div class="row"><label for="mode">Mode</label>
        <select id="mode">
          <option value="two_layer">Two-layer router</option>
          <option value="flat">Flat one-shot</option>
          <option value="bm25">BM25 keyword baseline</option>
        </select></div>
      <div class="row"><label for="l1-keep">Layer 1 — max clusters</label>
        <input type="number" id="l1-keep" min="1" max="20" step="1"></div>
      <div class="row"><label for="l1-floor" id="l1-floor-label">Layer 1 — floor</label>
        <input type="number" id="l1-floor" min="0" max="1" step="0.05"></div>
      <div class="row"><label for="l2-keep">Layer 2 — max nodes</label>
        <input type="number" id="l2-keep" min="1" max="20" step="1"></div>
      <div class="row"><label for="l2-floor" id="l2-floor-label">Layer 2 — floor</label>
        <input type="number" id="l2-floor" min="0" max="1" step="0.05"></div>
      <div class="row"><label for="fallback">Below the floor</label>
        <select id="fallback">
          <option value="refuse">Say not covered</option>
          <option value="answer_anyway">Answer anyway</option>
          <option value="widen">Widen and retry</option>
          <option value="escalate">Escalate the model</option>
          <option value="bm25_rescue">BM25 rescue</option>
        </select></div>
      <div class="row"><label for="escalate-model">Escalate to</label>
        <select id="escalate-model"></select></div>
      <div class="row"><label for="include-deprecated">Include deprecated nodes</label>
        <input type="checkbox" id="include-deprecated"></div>
      <div class="row"><label for="cache">Prompt caching</label>
        <select id="cache">
          <option value="auto">Auto (size-gated)</option>
          <option value="on">Always</option>
          <option value="off">Off</option>
        </select></div>
      <div class="row"><label for="flat-budget">Flat mode token budget</label>
        <input type="number" id="flat-budget" min="1000" step="1000"></div>
      <div class="row"><label for="bm25-k1">BM25 k1</label>
        <input type="number" id="bm25-k1" min="0" max="3" step="0.1"></div>
      <div class="row"><label for="bm25-b">BM25 b</label>
        <input type="number" id="bm25-b" min="0" max="1" step="0.05"></div>
    </div>

    <h2>Models</h2>
    <div class="grp" id="stages"></div>

    <h2>Prompts</h2>
    <div class="grp" id="prompts"></div>

    <h2>Vault</h2>
    <div class="grp">
      <p class="small" id="vault-stats"></p>
      <div class="btnrow">
        <button id="export-kbask">Export for /kb-ask</button>
        <button id="export-settings">Export settings</button>
        <button id="import-settings">Import settings</button>
        <button id="download-runs">Download run log</button>
      </div>
    </div>
  </aside>
</div>

<dialog id="modal">
  <h3 id="modal-title" style="margin:0 0 8px;font-size:14px;"></h3>
  <textarea id="modal-text" style="width:100%;min-height:300px;font-family:var(--mono);
            font-size:11px;padding:8px;border:1px solid var(--line);border-radius:6px;
            background:var(--bg);color:var(--ink);"></textarea>
  <div class="btnrow" style="justify-content:flex-end;">
    <button id="modal-copy">Copy</button>
    <button id="modal-ok" class="primary">Close</button>
  </div>
</dialog>

<!-- The compiled corpus. Written by build_chat_data.py, and the only part of
     this page that changes between builds. A .js assigning a global rather than
     a fetched .json: fetch() of a sibling file is blocked on file://, a script
     tag is not, so double-clicking chat.html works with no server. -->
<script src="_meta/chat-data.js"></script>
<script src="_meta/vendor/anthropic-sdk.browser.js"></script>
<script src="_meta/chat-app.js"></script>
</body>
